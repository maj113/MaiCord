name: Bug on Linux
description: Something in MaiCord on Linux is broken or behaves unexpectedly.
title: "[Linux] "
labels: [bug]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Two things are needed: what happened, and your **`maicord.log`**. The log names your MaiCord version, how you
        installed it, your distribution, desktop, kernel, GPU and display, so you don't need to type them. **Without the
        log the cause can't be found**, so the form asks for it.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Steps that make it happen again help most.
      placeholder: I signed in with my e-mail and password and got "Login failed. Check your details and try again", but the same details work in the official client.
    validations:
      required: true
  - type: upload
    id: log
    attributes:
      label: maicord.log
      description: >-
        Run `xdg-open ~/.local/state/maicord/logs` (or `$XDG_STATE_HOME/maicord/logs` if you set it), then drag
        `maicord.log` here (and `maicord.previous.log` if there is one). In a file picker, press Ctrl+L and type the
        path. The log keeps earlier sessions, so you can attach it after a restart. MaiCord keeps passwords, tokens
        and messages out of it.
    validations:
      required: true
      accept: ".log,.txt,.zip,.gz"
  - type: upload
    id: media
    attributes:
      label: Screenshots or a video
      description: Optional. Hide names and messages you don't want public.
    validations:
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"
