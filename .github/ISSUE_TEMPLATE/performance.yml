name: Performance problem
description: High CPU, GPU or memory use, slow startup, stutter or battery drain.
labels: [performance]
body:
  - type: textarea
    id: symptom
    attributes:
      label: What is slow or heavy?
      description: Include numbers if you have them (Task Manager or `top` CPU %, memory, frame drops; the environment variable `MAICORD_FPS_TITLE=1` shows the frame rate in the title) and what was on screen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MaiCord version
      placeholder: v0.7.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version or Linux distribution, CPU and GPU
      description: On Linux add the desktop and compositor, how you installed MaiCord, and the GPU driver (for example Mesa's version).
      placeholder: Windows 11 24H2, Ryzen 7 5800X, Radeon RX 6700 XT, 144 Hz; or Arch, KDE Plasma 6 on Wayland, Mesa 25.2
    validations:
      required: true
