name: CI

# Documentation, issue forms and repository metadata don't affect the build.
on:
  push:
    branches: [master]
    paths-ignore: &docs
      - "**/*.md"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/assets/**
      - .github/labeler.yml
      - .github/workflows/labeler.yml
      - .github/workflows/workflow-lint.yml
  pull_request:
    branches: [master]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Hosted Windows runners for this private repository have 2 vCPUs. The client
# build (about 8 minutes: front-end work plus the LTO link) and the
# temporary test build (non-LTO copies of the same libraries plus about 200
# test executables, about 11 minutes, then about 3 minutes of tests) are
# independent, so three jobs run side by side for about 10 minutes each:
#   client     MaiCord.exe, PE audits and the artifact;
#   app shard  tests whose executables link the application core or exercise
#              the shipping client itself (update staging and the exit swap); they
#              use the client job's artifact, which arrives while the tests
#              build (build.ps1 -PrebuiltClient), instead of building the
#              client a second time;
#   core shard every other test (text, fonts, media, protocol, platform).
# build.ps1 -TestShard picks each test's shard from its executable
# (maicord-tests.txt, written by CMake), builds only that shard's
# executables and runs exactly those tests. Both shards build most of the
# shared test libraries, so this costs runner minutes for wall time: about
# 29 runner minutes and 10 minutes of wall time per run, where one tests job
# (-TestShard app,core) takes about 26 runner minutes and 15 minutes, and a
# single job holding everything about 23 runner minutes and 23 minutes.
# Pull requests run the same full suite: the jobs already run side by side,
# so a pull-request subset would skip coverage without shortening the run.
# The build tree is deliberately not cached: checkout gives every source a
# fresh timestamp (so Ninja would rebuild anyway) and Release uses LTO.
# sccache was measured and rejected: it treats every CMake clang-cl compile here
# as "multiple input files" (nothing cacheable) and cannot cache PCH compiles.

jobs:
  client:
    name: Client (Windows x64 Release)
    # GitHub-hosted images may only carry Visual Studio 2022. The setup action
    # installs VS 2026 Build Tools when needed; point MAICORD_WINDOWS_RUNNER at
    # an image or self-hosted runner that already has it to skip that step.
    runs-on: ${{ vars.MAICORD_WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.collect.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
      dev: ${{ steps.identity.outputs.dev }}
    steps:
      # Full history: the build identity counts commits since the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          minimum-vs-major: ${{ vars.MAICORD_MIN_VS_MAJOR || '18' }}

      # A commit after the last stable tag builds as X.Y.Z-dev.N, the preview
      # channel's version; without an identity cmake/client.cmake builds the
      # project version with the updater disabled.
      - name: Build identity
        id: identity
        shell: powershell
        run: |
          python -B tools/release/maicord_release.py identity --repository .
          if ($LASTEXITCODE) { Write-Host '::warning::No build identity; building as the project version without the updater.' }
          exit 0

      - name: Release tooling self-test
        shell: powershell
        run: python -B tools/release/test_release_tools.py

      # The plugin index reference tool against the vectors tests/app/plugins/index.cpp uses.
      - name: Plugin index tooling self-test
        shell: powershell
        run: python -B tools/release/test_plugin_index_tools.py

      # build.ps1 configures the x64-release preset in ../MaiCord-build/Release,
      # builds MaiCord.exe and runs the PE audits
      # (D3D11-only imports, no Media Foundation/DirectWrite, no debug info).
      # Every test links the non-LTO test copies of the libraries, so the
      # test jobs cover them all.
      - name: Build and audit
        shell: powershell
        env:
          MAICORD_UPDATE_VERSION: ${{ steps.identity.outputs.version }}
          MAICORD_UPDATE_COMMIT: ${{ steps.identity.outputs.commit }}
          MAICORD_PLUGIN_CATALOG_PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_PUBLIC_KEY }}
          MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY }}
        run: ./tools/build.ps1

      # new, build, dev, check, pack and the effect commands against the pinned toolchain build.ps1 just fetched.
      - name: maicord-plugin tool self-test
        shell: powershell
        run: python -B tools/maicord-plugin/test_maicord_plugin.py

      - name: Collect client binaries
        id: collect
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'MaiCord-build\Release'
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $target = Join-Path $env:RUNNER_TEMP "MaiCord-x64-$short"
          New-Item -ItemType Directory -Path $target | Out-Null
          foreach ($item in 'MaiCord.exe', 'fonts', 'licenses') {
            Copy-Item -LiteralPath (Join-Path $build $item) -Destination $target -Recurse
          }
          $client = (Get-Item (Join-Path $target 'MaiCord.exe')).Length
          "### MaiCord build`n`n- $env:MAICORD_LLVM_VERSION`n- MaiCord.exe: $client bytes ($([math]::Round($client / 1MB, 2)) MiB)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "path=$target`nname=MaiCord-x64-$short`n")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.collect.outputs.name }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ${{ vars.MAICORD_WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the client job's artifact from this run
    strategy:
      matrix:
        shard: [app, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          minimum-vs-major: ${{ vars.MAICORD_MIN_VS_MAJOR || '18' }}

      # Tests link non-LTO copies of the shipping libraries, so these jobs never
      # build the client. For the app shard a background job fetches the client
      # job's artifact into the build directory while the tests build.
      - name: Build and run the ${{ matrix.shard }} tests
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          $ErrorActionPreference = 'Stop'
          $common = @{ Test = $true; TestShard = $env:SHARD; TestDeadlineSeconds = 300; TestTimeoutScale = 5; ExcludeTestLabels = 'gpu,display' }
          if ($env:SHARD -ne 'app') {
            ./tools/build.ps1 -SkipClient @common
          } else {
            $build = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'MaiCord-build\Release'
            $name = "MaiCord-x64-$($env:GITHUB_SHA.Substring(0, 8))"
            $fetch = Start-Job -ArgumentList $build, $name -ScriptBlock {
              param($build, $name)
              # Native stderr must not become a terminating error while polling.
              $ErrorActionPreference = 'Continue'
              $download = Join-Path $env:RUNNER_TEMP 'client'
              while ($true) {
                & gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $name --dir $download 2>&1 | Out-Null
                if ($LASTEXITCODE -eq 0) { break }
                $client = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name | startswith("Client")) | .conclusion' 2>&1
                if ($LASTEXITCODE -eq 0 -and "$client".Trim() -and "$client".Trim() -ne 'success') { "The client job ended without binaries ($client)."; return }
                Start-Sleep -Seconds 15
              }
              while (!(Test-Path -LiteralPath (Join-Path $build 'CMakeCache.txt'))) { Start-Sleep -Seconds 5 }
              # build.ps1 waits for the client; it appears complete.
              Copy-Item -LiteralPath (Join-Path $download 'MaiCord.exe') -Destination (Join-Path $build 'MaiCord.exe.partial') -ErrorAction Stop
              Move-Item -LiteralPath (Join-Path $build 'MaiCord.exe.partial') -Destination (Join-Path $build 'MaiCord.exe') -Force -ErrorAction Stop
              "Client binaries from $name are in place."
            }
            try {
              ./tools/build.ps1 -PrebuiltClient -ClientWaitSeconds 600 @common
            } finally {
              Stop-Job -Job $fetch
              Receive-Job -Job $fetch -ErrorAction Continue | Out-Host
              Remove-Job -Job $fetch -Force
            }
          }

  # The Linux port (D1, D11): one freestanding glibc image per test, built with the pinned apt.llvm.org clang 23 by the
  # same tools/build_linux.sh a developer runs, audited (tools/audit_elf.py runs inside it on every image) and tested
  # with Mesa's llvmpipe for the GPU cases. A clean build of everything took 44 seconds on 16
  # cores in a pristine ubuntu:24.04 container, and the suite then ran in 3 seconds; the shader toolchain (DXC, SPIRV-Cross,
  # mc_shadertool) is cached by the pins that name it (tools/linux_shader_toolchain.json, the tool's source and the
  # compiler that builds it), so only a change of pin builds SPIRV-Cross again. The compositor, D-Bus and audio scripts
  # run beside it (every case under 20 s: headless sway about 13 s, D-Bus 17 s, PulseAudio 8 s on the development
  # machine); they are reported but do not fail the job until the repository variable MAICORD_LINUX_INTEGRATION_BLOCKING
  # is 'true'. The portable subset of the built tests then goes to the distros job as a one-day artifact of this run.
  # Neither job gates the preview channel: the Windows client is what ships. With MAICORD_LINUX_RELEASES 'true' this job also
  # packages a master build's tarball (the Linux preview feed, signed by the preview job); nothing else is published from here.
  linux:
    name: Linux (x86-64 build, tests, ELF audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
      preview: ${{ steps.preview.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The build identity counts commits since the last release tag (see the client job).
      - name: Build identity
        id: identity
        run: |
          python3 -B tools/release/maicord_release.py identity --repository . || echo '::warning::No build identity; building as the project version without the updater.'

      # clang, lld and llvm 23 from apt.llvm.org (the archive key is checked against its pinned fingerprint), cmake, ninja,
      # and the runtime libraries, fonts, dictionaries and tools the tests and the integration scripts use.
      - name: Install the toolchain and the test packages
        run: bash tools/install_linux_toolchain.sh --integration

      - name: Shader toolchain cache key
        id: shader-key
        run: echo "compiler=$(c++ --version | head -n 1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the shader toolchain
        id: shader-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/maicord-toolchain
          key: maicord-shader-toolchain-${{ steps.shader-key.outputs.compiler }}-${{ hashFiles('tools/linux_shader_toolchain.json', 'tools/shadertool/mc_shadertool.cpp', 'tools/fetch_linux_shader_toolchain.py') }}

      # Configures into ~/mc-build in place (the checkout is on a native file system), builds, runs tools/audit_elf.py on
      # every image and the suite with ctest. Test limits are three times their local ones for the hosted runner.
      - name: Build, audit and test
        env:
          # The shipping client's updater identity, as the Windows client job gives its build, and the flag that lets the
          # tarball install update itself from the channels once they carry the tarball (entry.cpp).
          MAICORD_UPDATE_VERSION: ${{ steps.identity.outputs.version }}
          MAICORD_UPDATE_COMMIT: ${{ steps.identity.outputs.commit }}
          MAICORD_LINUX_RELEASES: ${{ vars.MAICORD_LINUX_RELEASES }}
        run: bash tools/build_linux.sh --test --keep --timeout-scale 3

      - name: Cache the shader toolchain
        if: steps.shader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/maicord-toolchain
          key: maicord-shader-toolchain-${{ steps.shader-key.outputs.compiler }}-${{ hashFiles('tools/linux_shader_toolchain.json', 'tools/shadertool/mc_shadertool.cpp', 'tools/fetch_linux_shader_toolchain.py') }}

      # The declarations the Linux build resolves with dlsym against the installed headers (libssl-dev, libpulse-dev,
      # libspeechd-dev).
      - name: dlopen ABI checks
        run: |
          python3 tools/check_openssl_abi.py --compiler /usr/lib/llvm-23/bin/clang
          python3 tools/check_pulse_abi.py --compiler /usr/lib/llvm-23/bin/clang
          python3 tools/check_speechd_abi.py --compiler /usr/lib/llvm-23/bin/clang

      # The tarball around a stand-in program (packaging/README.md): reproducible, valid desktop entry and AppStream
      # metadata, install and uninstall under a private home.
      - name: Packaging checks
        run: |
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          bash packaging/check.sh

      - name: Wayland window (headless sway)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: |
          bash tools/test_wayland_window.sh --binary "$HOME/mc-build/MaiCordWaylandWindowTests" --out "$RUNNER_TEMP/wayland"
          bash tools/test_wayland_window.sh --binary "$HOME/mc-build/MaiCordWaylandWindowTests" --scale 1.5 --out "$RUNNER_TEMP/wayland-scaled"

      - name: GPU surface (headless sway, llvmpipe)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: bash tools/test_gpu_surface.sh --binary "$HOME/mc-build/MaiCordGpuSurfaceWaylandTests" --out "$RUNNER_TEMP/gpu-surface"

      # The client itself on the signed-out login screen with a private profile: screenshot, idle CPU and wakeups, memory.
      - name: Client (headless sway, llvmpipe)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: bash tools/test_client_wayland.sh --binary "$HOME/mc-build/MaiCord" --out "$RUNNER_TEMP/client"

      # The client behind the real at-spi-bus-launcher and registry, read through libatspi (python3-gi): the tree of the
      # sign-in form, an action, field text, focus and text events, and accessibility off again.
      - name: Screen reader (AT-SPI, headless sway)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: |
          sudo apt-get install -y --no-install-recommends at-spi2-core gir1.2-atspi-2.0 python3-gi
          bash tools/test_atspi.sh --binary "$HOME/mc-build/MaiCord" --out "$RUNNER_TEMP/atspi"

      # tools/test_dbus_real.sh (the real xdg-desktop-portal and gnome-keyring) is left to a machine with a graphical
      # session: the portal's GTK backend needs a display and the document portal needs FUSE, which a hosted runner lacks.
      - name: D-Bus (mock services)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: bash tools/test_dbus.sh --binary-dir "$HOME/mc-build" --out "$RUNNER_TEMP/dbus"

      - name: Audio (private PulseAudio)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: bash tools/test_pulse_audio.sh --private --binary "$HOME/mc-build/MaiCordPulseLoopbackTests"

      - name: Text-to-speech (private speech-dispatcher, dummy module)
        continue-on-error: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING != 'true' }}
        run: bash tools/test_speechd.sh --binary "$HOME/mc-build/MaiCordSpeechdTests"

      # The cases tools/linux_portable_tests.txt names and the executables they run: what the distros job runs in other
      # distributions' containers.
      - name: Pack the portable tests
        id: bundle
        run: |
          python3 tools/linux_portable_tests.py --build "$HOME/mc-build" --output "$RUNNER_TEMP/portable"
          echo "name=linux-portable-${GITHUB_SHA::8}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # The master build's tarball (packaging/README.md) for the Linux preview feed: only for a push to master of the
      # repository that publishes, and only while the Linux channels are published.
      - name: Package the preview tarball
        id: preview
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'maj113/MaiCord' &&
          steps.identity.outputs.dev == 'true' && vars.MAICORD_LINUX_RELEASES == 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -eu
          python3 -B packaging/build_tarball.py --binary "$HOME/mc-build/MaiCord" --version "$VERSION" --output-dir "$RUNNER_TEMP/linux-preview"
          ls -l "$RUNNER_TEMP/linux-preview"
          echo "name=MaiCord-linux-x64-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preview.outputs.name != ''
        with:
          name: ${{ steps.preview.outputs.name }}
          path: ${{ runner.temp }}/linux-preview
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ runner.temp }}/portable
          if-no-files-found: error
          retention-days: 1

  # The one-binary claim (D1) on the distributions people run: the portable subset of the tests, the same executables, in
  # a container of each (tools/test_linux_distros.sh documents which package provides each dlopen()ed library). Fedora
  # and Arch are rolling releases and run their latest image on purpose; the others are pinned by tag.
  distros:
    name: Linux distros (${{ matrix.distro }})
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the linux job's bundle from this run
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, debian-12, fedora, archlinux, nixos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the portable tests
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ needs.linux.outputs.bundle }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUNDLE" --dir "$RUNNER_TEMP/portable"

      - name: Run them in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
        run: bash tools/test_linux_distros.sh --engine docker --bundle "$RUNNER_TEMP/portable" --out "$RUNNER_TEMP/distro" "$DISTRO"

  # Every green master build of maj113/MaiCord goes to the preview channel.
  # Only this job reads the signing key, and the release environment admits
  # only master and v* tags, so pull requests and forks never reach it. The
  # Linux job's tarball of the build joins it on the Linux preview feed when
  # there is one; the job's own result does not decide whether the Windows
  # build is published.
  preview:
    name: Publish the preview build
    needs: [client, tests, linux]
    if: >-
      ${{ !cancelled() && needs.client.result == 'success' && needs.tests.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.repository == 'maj113/MaiCord' && !github.event.repository.private &&
      needs.client.outputs.dev == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    # A newer build replaces a pending one. The branch push is leased, so this
    # may run beside release.yml and manifest-refresh.yml.
    concurrency:
      group: preview-channel
      cancel-in-progress: false
    permissions:
      contents: write # the update-channels branch
      actions: read   # the client job's artifact from this run
    outputs:
      deploy: ${{ steps.channels.outputs.deploy }}
    env:
      VERSION: ${{ needs.client.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch the client binaries
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.client.outputs.artifact }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ARTIFACT --dir "$env:RUNNER_TEMP\client"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package and sign the preview build
        shell: powershell
        env:
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:MAICORD_UPDATE_SIGNING_KEY -or !$env:PUBLIC_KEY) { throw 'The signing key secret or the public key variable is missing.' }
          python -B tools/release/maicord_release.py preview --binaries "$env:RUNNER_TEMP\client" `
            --output-dir "$env:RUNNER_TEMP\preview" --repository . --expect-version $env:VERSION --public-key $env:PUBLIC_KEY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\preview" | Format-Table Name, Length -AutoSize

      # The Linux tarball of the same master build (the linux job, when MAICORD_LINUX_RELEASES is 'true') is signed into the
      # Linux preview feed beside the Windows files. The Linux job gates nothing: without its tarball the Linux feed stays
      # where it is.
      - name: Fetch the Linux tarball
        if: vars.MAICORD_LINUX_RELEASES == 'true' && needs.linux.outputs.preview != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.linux.outputs.preview }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ARTIFACT --dir "$env:RUNNER_TEMP\linux"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign the Linux preview build
        if: vars.MAICORD_LINUX_RELEASES == 'true' && needs.linux.outputs.preview != ''
        shell: powershell
        env:
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:MAICORD_UPDATE_SIGNING_KEY -or !$env:PUBLIC_KEY) { throw 'The signing key secret or the public key variable is missing.' }
          $tarball = Get-ChildItem "$env:RUNNER_TEMP\linux" -Filter 'maicord-*-linux-x86_64.tar.gz' | Select-Object -First 1
          if (!$tarball) { throw 'The Linux job published no tarball.' }
          python -B tools/release/maicord_release.py linux --preview --tarball $tarball.FullName `
            --output-dir "$env:RUNNER_TEMP\preview" --repository . --expect-version $env:VERSION --public-key $env:PUBLIC_KEY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\preview" | Format-Table Name, Length -AutoSize

      - name: Update the preview channel
        id: channels
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
          # The Linux manifests (a stable release's tarball) are verified and re-signed with the rest; a master build has no
          # Linux package of its own.
          MAICORD_LINUX_RELEASES: ${{ vars.MAICORD_LINUX_RELEASES }}
        run: |
          ./tools/release/update_channels.ps1 -Site "$env:RUNNER_TEMP\update-channels" -Publish "$env:RUNNER_TEMP\preview" `
            -Message "Publish $env:VERSION to the preview channel"

  pages:
    name: Pages
    needs: preview
    if: needs.preview.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
