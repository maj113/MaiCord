name: CI

# Documentation, issue forms, repository metadata and the workflows this one never runs don't affect the build.
on:
  push:
    branches: [master]
    paths-ignore: &docs
      - "**/*.md"
      - LICENSE
      - .github/CODEOWNERS
      - .github/ISSUE_TEMPLATE/**
      - .github/assets/**
      - .github/codeql/**
      - .github/dependabot.yml
      - .github/labeler.yml
      - .github/workflows/analysis.yml
      - .github/workflows/labeler.yml
      - .github/workflows/manifest-refresh.yml
      - .github/workflows/release.yml
      - .github/workflows/text-reference.yml
      - .github/workflows/workflow-lint.yml
  pull_request:
    branches: [master]
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Hosted Windows runners have 4 vCPUs. The client build (front-end work plus the LTO link) and the temporary test build
# (non-LTO copies of the same libraries plus the test executables) are independent, so three jobs run side by side:
#   client     MaiCord.exe, PE audits and the artifact, and nothing else: the app shard waits for that artifact;
#   app shard  tests whose executables link the application core or exercise the shipping client itself (update staging
#              and the exit swap); they use the client job's artifact, which arrives while the tests build
#              (build.ps1 -SkipClient -ClientWaitSeconds), instead of building the client a second time;
#   core shard every other test (text, fonts, media, protocol, platform), and the self-tests of the Python tools
#              (release, plugin index, maicord-plugin), which need the toolchain but no build.
# build.ps1 -TestShard picks each test's shard from its executable (maicord-tests.txt, written by CMake), builds only that
# shard's executables and runs exactly those tests. Pull requests run the same full suite: the jobs already run side by
# side, so a pull-request subset would skip coverage without shortening the run.
# The build tree is deliberately not cached: checkout gives every source a fresh timestamp (so Ninja would rebuild
# anyway) and Release uses LTO. sccache was measured and rejected: it treats every CMake clang-cl compile here as
# "multiple input files" (nothing cacheable) and cannot cache PCH compiles.

jobs:
  client:
    name: Client (Windows x64 Release)
    # GitHub-hosted images may only carry Visual Studio 2022. The setup action
    # installs VS 2026 Build Tools when needed; point MAICORD_WINDOWS_RUNNER at
    # an image or self-hosted runner that already has it to skip that step.
    runs-on: ${{ vars.MAICORD_WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.collect.outputs.name }}
      version: ${{ steps.identity.outputs.version }}
      dev: ${{ steps.identity.outputs.dev }}
    steps:
      # Full history: the build identity counts commits since the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          minimum-vs-major: ${{ vars.MAICORD_MIN_VS_MAJOR || '18' }}

      # A commit after the last stable tag builds as X.Y.Z-dev.N, the preview
      # channel's version; without an identity cmake/client.cmake builds the
      # project version with the updater disabled.
      - name: Build identity
        id: identity
        shell: powershell
        run: |
          python -B tools/release/maicord_release.py identity --repository .
          if ($LASTEXITCODE) { Write-Host '::warning::No build identity; building as the project version without the updater.' }
          exit 0

      # build.ps1 configures the x64-release preset in ../MaiCord-build/Release,
      # builds MaiCord.exe and runs the PE audits
      # (D3D11-only imports, no Media Foundation/DirectWrite, no debug info).
      # Every test links the non-LTO test copies of the libraries, so the
      # test jobs cover them all.
      - name: Build and audit
        shell: powershell
        env:
          MAICORD_UPDATE_VERSION: ${{ steps.identity.outputs.version }}
          MAICORD_UPDATE_COMMIT: ${{ steps.identity.outputs.commit }}
          MAICORD_PLUGIN_CATALOG_PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_PUBLIC_KEY }}
          MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY }}
          # A packed stream missing from tools/deflate_cache.txt fails the build instead of shipping a zlib fallback.
          MAICORD_REQUIRE_DEFLATE_CACHE: "1"
        run: ./tools/build.ps1

      - name: Collect client binaries
        id: collect
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'MaiCord-build\Release'
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $target = Join-Path $env:RUNNER_TEMP "MaiCord-x64-$short"
          New-Item -ItemType Directory -Path $target | Out-Null
          foreach ($item in 'MaiCord.exe', 'fonts', 'licenses') {
            Copy-Item -LiteralPath (Join-Path $build $item) -Destination $target -Recurse
          }
          $client = (Get-Item (Join-Path $target 'MaiCord.exe')).Length
          "### MaiCord build`n`n- $env:MAICORD_LLVM_VERSION`n- MaiCord.exe: $client bytes ($([math]::Round($client / 1MB, 2)) MiB)" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding ascii
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "path=$target`nname=MaiCord-x64-$short`n")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.collect.outputs.name }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Tests (${{ matrix.shard }})
    runs-on: ${{ vars.MAICORD_WINDOWS_RUNNER || 'windows-2025' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the client job's artifact from this run
    strategy:
      matrix:
        shard: [app, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          minimum-vs-major: ${{ vars.MAICORD_MIN_VS_MAJOR || '18' }}

      # The shard with the shortest build also runs the Python tools' self-tests: the release tooling, the plugin index
      # reference tool against the vectors tests/app/plugins/index.cpp uses, and maicord-plugin (new, build, dev, check,
      # pack and the effect commands against the pinned toolchain the setup action fetched).
      - name: Tool self-tests
        if: matrix.shard == 'core'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test in 'tools/release/test_release_tools.py', 'tools/release/test_plugin_index_tools.py', 'tools/maicord-plugin/test_maicord_plugin.py') {
            python -B $test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      # Tests link non-LTO copies of the shipping libraries, so these jobs never
      # build the client. For the app shard a background job fetches the client
      # job's artifact into the build directory while the tests build.
      - name: Build and run the ${{ matrix.shard }} tests
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          MAICORD_REQUIRE_DEFLATE_CACHE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $common = @{ Test = $true; SkipClient = $true; TestShard = $env:SHARD; TestDeadlineSeconds = 300; TestTimeoutScale = 5; ExcludeTestLabels = 'gpu,display' }
          if ($env:SHARD -ne 'app') {
            ./tools/build.ps1 @common
          } else {
            $build = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) 'MaiCord-build\Release'
            $name = "MaiCord-x64-$($env:GITHUB_SHA.Substring(0, 8))"
            $fetch = Start-Job -ArgumentList $build, $name -ScriptBlock {
              param($build, $name)
              # Native stderr must not become a terminating error while polling.
              $ErrorActionPreference = 'Continue'
              $download = Join-Path $env:RUNNER_TEMP 'client'
              while ($true) {
                & gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $name --dir $download 2>&1 | Out-Null
                if ($LASTEXITCODE -eq 0) { break }
                $client = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name | startswith("Client")) | .conclusion' 2>&1
                if ($LASTEXITCODE -eq 0 -and "$client".Trim() -and "$client".Trim() -ne 'success') { "The client job ended without binaries ($client)."; return }
                Start-Sleep -Seconds 15
              }
              while (!(Test-Path -LiteralPath (Join-Path $build 'CMakeCache.txt'))) { Start-Sleep -Seconds 5 }
              # build.ps1 waits for the client; it appears complete.
              Copy-Item -LiteralPath (Join-Path $download 'MaiCord.exe') -Destination (Join-Path $build 'MaiCord.exe.partial') -ErrorAction Stop
              Move-Item -LiteralPath (Join-Path $build 'MaiCord.exe.partial') -Destination (Join-Path $build 'MaiCord.exe') -Force -ErrorAction Stop
              "Client binaries from $name are in place."
            }
            try {
              ./tools/build.ps1 -ClientWaitSeconds 600 @common
            } finally {
              Stop-Job -Job $fetch
              Receive-Job -Job $fetch -ErrorAction Continue | Out-Host
              Remove-Job -Job $fetch -Force
            }
          }

  # The Linux port: freestanding glibc images built with the pinned LLVM toolchain release (the Linux asset of
  # tools/llvm_toolchain.json) by the same tools/build_linux.sh a developer runs, audited (tools/audit_image.py, in the
  # build) and tested with Mesa's llvmpipe for the GPU cases; the shaders are GLSL the build packs with python, so no shader
  # compiler is fetched or built. As on Windows, the work runs side by side on 4-vCPU runners:
  #   linux-client  the shipping MaiCord (no test hooks; glibc and musl forms audited) and its artifact, the core test
  #                 shard against it (--version, the UI text, the plugin SDK compile cases, the desktop entry), the
  #                 packaging checks, the client and AT-SPI integration runs, and on master the preview tarball and AppImage;
  #   linux-tests   suite: the app shard but for the cases the portable part takes;
  #                 portable: the cases tools/linux_portable_tests.txt names (packed for the distros job) and the
  #                 programs the other integration runs drive, then the ABI checks and those integration runs.
  # The parts are balanced by measured build and test time (each one also compiles the shipping libraries). The
  # integration scripts (headless sway, D-Bus, PulseAudio, speech-dispatcher) are reported but do not fail a job until
  # the repository variable MAICORD_LINUX_INTEGRATION_BLOCKING is 'true'. No Linux job gates the preview channel: the
  # Windows client is what ships. With MAICORD_LINUX_RELEASES 'true' a master build's tarball and AppImage go to the Linux
  # preview feed (signed by the preview job); nothing else is published from here.
  linux-client:
    name: Linux client (x86-64 build, ELF audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      preview: ${{ steps.preview.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The build identity counts commits since the last release tag (see the client job).
      - name: Build identity
        id: identity
        run: |
          python3 -B tools/release/maicord_release.py identity --repository . || echo '::warning::No build identity; building as the project version without the updater.'

      # The pinned LLVM toolchain (cached as the Windows jobs cache theirs), cmake, ninja, what hosted links need, and the
      # libraries and tools the core tests, the packaging checks and the integration runs use.
      - uses: ./.github/actions/setup-toolchain
        with:
          linux-packages: integration

      # The client that ships, into ~/mc-build (the checkout is on a native file system): built without the tests'
      # switches, audited when it links and in its musl form.
      - name: Build and audit
        env:
          # The shipping client's updater identity, as the Windows client job gives its build, and the flag that lets the
          # tarball install update itself from the channels once they carry the tarball (entry.cpp).
          MAICORD_UPDATE_VERSION: ${{ steps.identity.outputs.version }}
          MAICORD_UPDATE_COMMIT: ${{ steps.identity.outputs.commit }}
          MAICORD_LINUX_RELEASES: ${{ vars.MAICORD_LINUX_RELEASES }}
          MAICORD_REQUIRE_DEFLATE_CACHE: "1"
        run: bash tools/build_linux.sh

      # The distros job runs this client on headless sway in the distributions that install sway.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-client-${{ github.run_attempt }}
          path: ~/mc-build/MaiCord
          if-no-files-found: error
          retention-days: 1

      # The core shard (maicord-tests.txt) is what runs the client itself; --skip-client keeps the one just built.
      - name: Core tests
        env:
          MAICORD_REQUIRE_DEFLATE_CACHE: "1"
        run: bash tools/build_linux.sh --test --skip-client --test-shard core --test-timeout-scale 3

      # The packages around a stand-in program (packaging/README.md): the reproducible tarball, the AppImage, the one-line
      # installer, valid desktop entry and AppStream metadata, and, with nfpm, the .deb and .rpm.
      - name: Packaging checks
        run: |
          sh packaging/nfpm/install_nfpm.sh "$RUNNER_TEMP/tools"
          PATH="$RUNNER_TEMP/tools:$PATH" bash packaging/check.sh

      # The client on its signed-out screen and behind AT-SPI (tools/test_linux_integration.sh).
      - name: Integration (client, AT-SPI)
        env:
          MAICORD_LINUX_INTEGRATION_BLOCKING: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING }}
        run: bash tools/test_linux_integration.sh --out "$RUNNER_TEMP/integration" client atspi

      # The master build's tarball and AppImage (packaging/README.md) for the Linux preview feed, from the client above: only
      # for a push to master of the repository that publishes, and only while the Linux channels are published.
      - name: Package the preview tarball
        id: preview
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'maj113/MaiCord' &&
          steps.identity.outputs.dev == 'true' && vars.MAICORD_LINUX_RELEASES == 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -eu
          python3 -B packaging/build_tarball.py --binary "$HOME/mc-build/MaiCord" --version "$VERSION" --output-dir "$RUNNER_TEMP/linux-preview"
          python3 -B packaging/appimage/build_appimage.py --tarball "$RUNNER_TEMP/linux-preview/maicord-$VERSION-linux-x86_64.tar.gz" --output-dir "$RUNNER_TEMP/linux-preview"
          ls -l "$RUNNER_TEMP/linux-preview"
          echo "name=MaiCord-linux-x64-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.preview.outputs.name != ''
        with:
          name: ${{ steps.preview.outputs.name }}
          path: ${{ runner.temp }}/linux-preview
          if-no-files-found: error
          retention-days: 14

  linux-tests:
    name: Linux tests (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        part: [suite, portable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tests build with the identity the client gets (the updater's tests read it).
      - name: Build identity
        id: identity
        run: |
          python3 -B tools/release/maicord_release.py identity --repository . || echo '::warning::No build identity; building as the project version without the updater.'

      # The runtime libraries, fonts, dictionaries and headers the suite uses; the portable part also runs the integration
      # scripts and so takes their tools.
      - uses: ./.github/actions/setup-toolchain
        with:
          linux-packages: ${{ matrix.part == 'portable' && 'integration' || 'tests' }}

      # The portable part: every case tools/linux_portable_tests.txt names and one case of each program the integration
      # runs below drive (which builds it). The suite part: the rest of the app shard. Test limits are three times their
      # local ones for the hosted runner.
      - name: Build, audit and test
        env:
          PART: ${{ matrix.part }}
          MAICORD_UPDATE_VERSION: ${{ steps.identity.outputs.version }}
          MAICORD_UPDATE_COMMIT: ${{ steps.identity.outputs.commit }}
          MAICORD_LINUX_RELEASES: ${{ vars.MAICORD_LINUX_RELEASES }}
          MAICORD_REQUIRE_DEFLATE_CACHE: "1"
        run: |
          set -eu
          names="$(grep -v -e '^#' -e '^\[' -e '^$' tools/linux_portable_tests.txt | paste -s -d , -)"
          names="$names,maicord_wayland_window_lifecycle,maicord_gpu_surface_wayland,maicord_dbus_wire,maicord_dbus_bus"
          names="$names,maicord_dbus_services,maicord_linux_notifications_mock,maicord_dbus_secure_buffer,maicord_dbus_desktop"
          names="$names,maicord_atspi_bus,maicord_pulse_loopback,maicord_speechd_live"
          if [ "$PART" = portable ]; then selection=(--test-names "$names"); else selection=(--test-shard app --exclude-test-names "$names"); fi
          bash tools/build_linux.sh --test --skip-client --keep-intermediates --test-timeout-scale 3 "${selection[@]}"

      # The declarations the Linux build resolves with dlsym, and the libc, errno and addrinfo pins, against the installed
      # headers (libc6-dev, libssl-dev, libpulse-dev, libspeechd-dev, libfido2-dev, libva-dev, libdav1d-dev, libopenh264-dev,
      # libpipewire-0.3-dev, libspa-0.2-dev), side by side.
      - name: ABI checks
        if: matrix.part == 'portable'
        run: |
          for abi in libc openssl pulse speechd fido2 video pipewire; do
            python3 -B "tools/check_${abi}_abi.py" --compiler "$MAICORD_LLVM_BIN/clang" > "$RUNNER_TEMP/abi-$abi.log" 2>&1 &
          done
          status=0
          for abi in libc openssl pulse speechd fido2 video pipewire; do
            wait -n || status=1
          done
          for abi in libc openssl pulse speechd fido2 video pipewire; do echo "::group::$abi"; cat "$RUNNER_TEMP/abi-$abi.log"; echo "::endgroup::"; done
          exit "$status"

      # Headless sway, the GPU surface, the D-Bus mocks, PulseAudio and speech-dispatcher (tools/test_linux_integration.sh
      # lists them; the client and AT-SPI runs are the client job's). tools/test_dbus_real.sh (the real xdg-desktop-portal and
      # gnome-keyring) is left to a machine with a graphical session: the portal's GTK backend needs a display and the
      # document portal needs FUSE, which a hosted runner lacks.
      - name: Integration (Wayland, GPU surface, D-Bus, audio, speech)
        if: matrix.part == 'portable'
        env:
          MAICORD_LINUX_INTEGRATION_BLOCKING: ${{ vars.MAICORD_LINUX_INTEGRATION_BLOCKING }}
        run: bash tools/test_linux_integration.sh --out "$RUNNER_TEMP/integration" wayland gpu-surface dbus audio speech

      # The cases tools/linux_portable_tests.txt names and the executables they run: what the distros job runs in other
      # distributions' containers.
      - name: Pack the portable tests
        if: matrix.part == 'portable'
        run: python3 tools/linux_portable_tests.py --build "$HOME/mc-build" --output "$RUNNER_TEMP/portable"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.part == 'portable'
        with:
          name: linux-portable-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portable
          if-no-files-found: error
          retention-days: 1

  # The one-binary claim on the distributions people run, glibc and musl: the portable subset of the tests, the same
  # executables (retargeted to musl's loader for the musl ones), in a container of each (tools/test_linux_distros.sh documents
  # which package provides each dlopen()ed library), and the shipping client on headless sway where the distribution installs
  # sway. The runtime needs io_uring, so the script runs the containers with seccomp unconfined. Fedora, Arch and the musl
  # distributions are rolling and run their latest image on purpose; the others are pinned by tag.
  distros:
    name: Linux distros (${{ matrix.distro }})
    needs: [linux-client, linux-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # the Linux jobs' bundle and client from this run
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, debian-12, almalinux-9, fedora, archlinux, nixos, alpine, void-musl, chimera]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the portable tests and the client
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "linux-portable-$ATTEMPT" --dir "$RUNNER_TEMP/portable"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "linux-client-$ATTEMPT" --dir "$RUNNER_TEMP/client"

      - name: Run them in ${{ matrix.distro }}
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          bash tools/test_linux_distros.sh --engine docker --bundle "$RUNNER_TEMP/portable" --client "$RUNNER_TEMP/client/MaiCord" \
            --out "$RUNNER_TEMP/distro" "$DISTRO"

  # Every green master build of maj113/MaiCord goes to the preview channel.
  # Only this job reads the signing key, and the release environment admits
  # only master and v* tags, so pull requests and forks never reach it. The
  # Linux client job's tarball of the build joins it on the Linux preview feed
  # when there is one; that job's own result does not decide whether the Windows
  # build is published.
  preview:
    name: Publish the preview build
    needs: [client, tests, linux-client]
    if: >-
      ${{ !cancelled() && needs.client.result == 'success' && needs.tests.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.repository == 'maj113/MaiCord' && !github.event.repository.private &&
      needs.client.outputs.dev == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release
    # A newer build replaces a pending one. The branch push is leased, so this
    # may run beside release.yml and manifest-refresh.yml.
    concurrency:
      group: preview-channel
      cancel-in-progress: false
    permissions:
      contents: write # the update-channels branch
      actions: read   # the client job's artifact from this run
    outputs:
      deploy: ${{ steps.channels.outputs.deploy }}
    env:
      VERSION: ${{ needs.client.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch the client binaries
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.client.outputs.artifact }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ARTIFACT --dir "$env:RUNNER_TEMP\client"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package and sign the preview build
        shell: powershell
        env:
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:MAICORD_UPDATE_SIGNING_KEY -or !$env:PUBLIC_KEY) { throw 'The signing key secret or the public key variable is missing.' }
          python -B tools/release/maicord_release.py preview --binaries "$env:RUNNER_TEMP\client" `
            --output-dir "$env:RUNNER_TEMP\preview" --repository . --expect-version $env:VERSION --public-key $env:PUBLIC_KEY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\preview" | Format-Table Name, Length -AutoSize

      # The Linux tarball of the same master build (the linux-client job, when MAICORD_LINUX_RELEASES is 'true') is signed into the
      # Linux preview feed beside the Windows files. The Linux client job gates nothing: without its tarball the Linux feed
      # stays where it is.
      - name: Fetch the Linux tarball
        if: vars.MAICORD_LINUX_RELEASES == 'true' && needs.linux-client.outputs.preview != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.linux-client.outputs.preview }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:ARTIFACT --dir "$env:RUNNER_TEMP\linux"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign the Linux preview build
        if: vars.MAICORD_LINUX_RELEASES == 'true' && needs.linux-client.outputs.preview != ''
        shell: powershell
        env:
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:MAICORD_UPDATE_SIGNING_KEY -or !$env:PUBLIC_KEY) { throw 'The signing key secret or the public key variable is missing.' }
          $tarball = Get-ChildItem "$env:RUNNER_TEMP\linux" -Filter 'maicord-*-linux-x86_64.tar.gz' | Select-Object -First 1
          if (!$tarball) { throw 'The Linux job published no tarball.' }
          python -B tools/release/maicord_release.py linux --preview --tarball $tarball.FullName `
            --output-dir "$env:RUNNER_TEMP\preview" --repository . --expect-version $env:VERSION --public-key $env:PUBLIC_KEY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The master build's AppImage (the glibc one) has its own manifest on the Linux preview feed.
          $appimage = Get-ChildItem "$env:RUNNER_TEMP\linux" -Filter 'MaiCord-*-x86_64.AppImage' | Select-Object -First 1
          if (!$appimage) { throw 'The Linux job published no AppImage.' }
          python -B tools/release/maicord_release.py linux --appimage --preview --tarball $appimage.FullName `
            --output-dir "$env:RUNNER_TEMP\preview" --repository . --expect-version $env:VERSION --public-key $env:PUBLIC_KEY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem "$env:RUNNER_TEMP\preview" | Format-Table Name, Length -AutoSize

      - name: Update the preview channel
        id: channels
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
          # The Linux manifests (a stable release's tarball) are verified and re-signed with the rest; a master build has no
          # Linux package of its own.
          MAICORD_LINUX_RELEASES: ${{ vars.MAICORD_LINUX_RELEASES }}
        run: |
          ./tools/release/update_channels.ps1 -Site "$env:RUNNER_TEMP\update-channels" -Publish "$env:RUNNER_TEMP\preview" `
            -Message "Publish $env:VERSION to the preview channel"

  pages:
    name: Pages
    needs: preview
    if: needs.preview.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
