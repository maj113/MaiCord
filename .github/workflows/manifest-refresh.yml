name: Refresh update manifests

# Signed manifests expire (default 90 days) so a stale or replayed offer cannot
# be served forever. This job re-signs the channel manifests on the
# update-channels branch when they are within 30 days of expiry and redeploys
# GitHub Pages. Releases are immutable and never touched. A manual run always
# redeploys the current channels.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-channels
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-sign expiring channel manifests
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write   # the update-channels branch
    outputs:
      deploy: ${{ steps.channels.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/release

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-sign expiring channel manifests
        id: channels
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MAICORD_UPDATE_SIGNING_KEY: ${{ secrets.MAICORD_UPDATE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.MAICORD_UPDATE_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:PUBLIC_KEY -or !$env:MAICORD_UPDATE_SIGNING_KEY) { throw 'Signing key secret or public key variable is missing.' }
          $private = gh api "repos/$env:GITHUB_REPOSITORY" --jq .private
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($private -eq 'true') {
            Write-Host '::warning::Private repository: GitHub Pages is unavailable, so the update channels are not served.'
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "deploy=false`n")
            exit 0
          }
          $manual = @{ AlwaysDeploy = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' }
          ./tools/release/update_channels.ps1 -Site "$env:RUNNER_TEMP\update-channels" -RefreshWithinDays 30 `
            -Message 'Re-sign expiring channel manifests' @manual

  pages:
    name: Pages
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
