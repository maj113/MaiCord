name: Deploy the update channels

# Called by the workflows that write the update-channels branch. It deploys
# the branch as it is when this job runs, so racing writers never leave an
# older site deployed over a newer one.
on:
  workflow_call:
    inputs:
      stable-version:
        description: >
          The update number a release just published: the live stable manifests (Windows, and the Linux tarball's and
          the AppImage's while MAICORD_LINUX_RELEASES is 'true') must carry it.
        type: string
        default: ""

permissions: {}

jobs:
  deploy:
    name: Deploy the update channels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: update-channels
          path: site
          persist-credentials: false

      - id: artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # What actions/deploy-pages does, but with the deployed files' own build version. The action sends the workflow's
      # commit SHA, and Pages answers a second deployment of a version it already deployed with that old deployment,
      # reporting success while the site keeps the old files (a release tag on a commit CI had already deployed never
      # goes live). Pages accepts only a commit of this repository as the version, so it is the update-channels commit
      # being deployed: every change of the channels is a new commit, and deploying the same commit again would serve the
      # same files.
      - name: Deploy
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          version="$(git -C site rev-parse HEAD)"
          oidc="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          echo "::add-mask::$oidc"
          response="$(jq -n --argjson artifact "$ARTIFACT_ID" --arg version "$version" --arg oidc "$oidc" \
            '{artifact_id: $artifact, pages_build_version: $version, oidc_token: $oidc}' |
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments" --input -)"
          status_url="$(jq -r .status_url <<< "$response")"
          echo "page_url=$(jq -r .page_url <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "Pages deployment $version of artifact $ARTIFACT_ID: $status_url"
          for _ in $(seq 1 120); do
            sleep 5
            status="$(gh api "$status_url" --jq .status)" || { echo "The status request failed; asking again."; continue; }
            case "$status" in
              succeed) echo "Deployed $version."; exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment $version ended with $status."; exit 1 ;;
              *) echo "Status: $status" ;;
            esac
          done
          gh api --method POST "$status_url/cancel" > /dev/null || true
          echo "::error::Pages deployment $version did not finish in 10 minutes; it was cancelled."
          exit 1

      # The live site must serve what was just deployed: every signed manifest of the branch, byte for byte (fetched past
      # the CDN's cache), and after a release the released version on the stable channels. Pages can take a little while
      # to serve a new deployment, so this asks for up to five minutes.
      - name: Check the live channels
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          STABLE_VERSION: ${{ inputs.stable-version }}
          MAICORD_LINUX_RELEASES: ${{ vars.MAICORD_LINUX_RELEASES }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          mapfile -t manifests < <(cd site && find . -path ./.git -prune -o -type f -name '*.manifest.json' -print | sed 's|^\./||' | LC_ALL=C sort)
          if [ "${#manifests[@]}" -eq 0 ]; then echo "::error::The update-channels branch holds no manifest to check."; exit 1; fi
          required=()
          if [ -n "$STABLE_VERSION" ]; then
            required=(updates/p2/maicord-stable.manifest.json)
            if [ "${MAICORD_LINUX_RELEASES:-}" = true ]; then
              required+=(updates/p2/linux/maicord-stable.manifest.json updates/p2/linux/appimage/maicord-stable.manifest.json)
            fi
            for path in "${required[@]}"; do
              if [ ! -f "site/$path" ]; then echo "::error::$path is not on the update-channels branch."; exit 1; fi
              version="$(jq -r .version "site/$path")"
              if [ "$version" != "$STABLE_VERSION" ]; then
                echo "::error::The deployed $path carries version $version, not the released $STABLE_VERSION."
                exit 1
              fi
            done
          fi

          served="$RUNNER_TEMP/served"
          deadline=$((SECONDS + 300))
          while true; do
            stale=()
            for path in "${manifests[@]}"; do
              # A query the CDN has not seen gets past its cache.
              status="$(curl -sS -L --max-time 30 -H 'Cache-Control: no-cache' -o "$served" -D "$served.headers" -w '%{http_code}' \
                "$base$path?deployment=$(tr -d - < /proc/sys/kernel/random/uuid)")" || status=failed
              if [[ "$status" == 2?? ]]; then
                if cmp -s "$served" "site/$path"; then continue; fi
                modified="$(sed -n 's/^last-modified: *//Ip' "$served.headers" | tr -d '\r' | tail -n 1)"
                stale+=("$path|${modified:-?}")
              elif [ "$status" = failed ]; then
                stale+=("$path|the request failed")
              else
                stale+=("$path|HTTP $status")
              fi
            done
            if [ "${#stale[@]}" -eq 0 ]; then break; fi
            if [ "$SECONDS" -gt "$deadline" ]; then
              for entry in "${stale[@]}"; do
                echo "::error::$base${entry%%|*} does not serve the deployed file (last modified: ${entry#*|})."
              done
              exit 1
            fi
            echo "${#stale[@]} of ${#manifests[@]} manifests not live yet; asking again in 15 s."
            sleep 15
          done
          echo "The live site serves the ${#manifests[@]} deployed manifests."
          for path in "${required[@]}"; do echo "$path: version $STABLE_VERSION"; done
