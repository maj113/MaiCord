name: Label pull requests

# Labels come from changed paths (.github/labeler.yml). pull_request_target
# runs the base branch's workflow and never checks out the pull request's
# code, so fork pull requests can be labeled safely.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
