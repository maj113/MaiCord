name: Workflow lint

# Security audit of the workflows, composite actions and Dependabot config.
on:
  push:
    branches: [master]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Code scanning isn't available to this private repository, so findings
      # are printed and fail the job instead of being uploaded as SARIF.
      # --strict-collection also fails on workflow files GitHub couldn't parse.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --strict-collection --min-severity medium --format plain .github
