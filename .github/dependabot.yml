version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # Let new action releases age a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, "area: build"]
    commit-message:
      prefix: ci
