# Path-based labels for pull requests (actions/labeler).
"area: messages":
  - changed-files:
      - any-glob-to-any-file: ["src/app/chat/**", "include/maicord/app/chat/**", "src/ui/chat/**", "include/maicord/ui/chat/**", "src/protocol/messages/**", "src/ui/text/ansi_text*"]
"area: voice & video":
  - changed-files:
      - any-glob-to-any-file: ["src/app/voice/**", "include/maicord/app/voice/**", "src/ui/voice/**", "src/protocol/voice/**"]
"area: media":
  - changed-files:
      - any-glob-to-any-file: ["src/media/**", "src/app/media/**", "include/maicord/app/media/**", "src/platform/decode/**", "src/render/media/**", "third_party/opus/**"]
"area: servers":
  - changed-files:
      - any-glob-to-any-file: ["src/app/guild/**", "include/maicord/app/guild/**", "src/ui/guild/**", "src/model/guild/**", "src/protocol/guild/**"]
"area: accounts":
  - changed-files:
      - any-glob-to-any-file: ["src/app/account/**", "include/maicord/app/account/**", "src/ui/account/**", "src/protocol/auth/**", "src/protocol/user/**"]
"area: plugins":
  - changed-files:
      - any-glob-to-any-file: ["include/maicord/sdk/**", "src/app/plugins/**", "include/maicord/app/plugins/**", "include/maicord/ui/plugins/**", "samples/plugins/**"]
"area: themes":
  - changed-files:
      - any-glob-to-any-file: ["include/maicord/ui/theme/**", "src/ui/theme/**", "src/app/settings/client_theme*", "include/maicord/app/settings/client_theme*", "assets/themes/**"]
"area: updater":
  - changed-files:
      - any-glob-to-any-file: ["src/app/update/**", "include/maicord/app/update/**", "tools/release/**", ".github/workflows/release.yml", ".github/workflows/manifest-refresh.yml"]
"area: text":
  - changed-files:
      - any-glob-to-any-file: ["src/text/**", "include/maicord/text/**", "src/ui/text/**", "src/render/text/**", "assets/fonts/**"]
"area: build":
  - changed-files:
      - any-glob-to-any-file: ["CMakeLists.txt", "cmake/**", "CMakePresets.json", "tools/*.ps1", "tools/*.py", ".github/**"]
documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]
