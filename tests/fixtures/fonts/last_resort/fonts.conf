<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The host's fonts and one more: LastResortKana.ttf covers the Hiragana block with a box, as Unifont does, together
     with the unassigned U+3040 but not U+3041. Its GSUB is Unifont's. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
</fontconfig>
