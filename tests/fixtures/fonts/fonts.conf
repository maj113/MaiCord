<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A NixOS-style configuration for the font locator test: an xdg directory, a store path that does not exist and
     an include directory whose file adds the repository's bundled fonts. -->
<fontconfig>
  <!-- <dir>/commented/out</dir> -->
  <dir prefix="xdg">fonts</dir>
  <dir>/nix/store/00000000000000000000000000000000-no-such-fonts/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <include ignore_missing="yes">conf.d</include>
  <include ignore_missing="yes">/nonexistent/maicord/fonts.conf</include>
</fontconfig>
