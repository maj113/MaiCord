<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The repository's bundled fonts and RefusedKana.ttf, the only face that covers Hiragana here. Its GSUB names a
     feature its empty feature list does not hold, so the text engine cannot prepare it. -->
<fontconfig>
  <dir prefix="relative">../../../../assets/fonts</dir>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
